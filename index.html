<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6F1E7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#19140F" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hundra" />
    <meta name="description" content="Logga mat snabbt. 100 poäng är din dag." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Hundra</title>
    <style>
      /* Startbilden syns medan appens kod laddas och ersätts av React när appen ritas första
         gången. Samma bakgrund som --bg i src/styles/tokens.css, ändra dem tillsammans. Bilden tonas
         in efter en kort stund, så att den inte blinkar till när appen startar snabbt. */
      html { background: #f6f1e7; }
      @media (prefers-color-scheme: dark) { html { background: #19140f; } }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; animation: boot-in 0.3s ease 0.3s both; }
      #boot svg { width: 88px; height: 88px; }
      @keyframes boot-in { from { opacity: 0; } }
    </style>
    <!-- Anonym besöksräknare (GoatCounter): inga cookies, ingen matdata skickas. -->
    <script data-goatcounter="https://hundra.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="root">
      <!-- Appikonen utan SVG-filter, som Safari ritar långsamt. -->
      <div id="boot" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
          <rect width="64" height="64" rx="14" fill="#3D78D8" />
          <g transform="translate(2.2 1.8)">
            <circle cx="32" cy="32" r="21" fill="#FFF8EA" />
            <circle cx="32" cy="32" r="18.5" fill="none" stroke="#3BAA5C" stroke-opacity=".25" stroke-width="5" />
            <path d="M32 13.5A18.5 18.5 0 1 1 13.8 35.5" fill="none" stroke="#3BAA5C" stroke-width="5" stroke-linecap="round" />
            <path d="M27 33.5c0-3.6 2.6-6.4 5.8-6.4s5.6 2.6 5.6 6c0 3.5-2.5 5.8-5.8 5.8S27 37 27 33.5Z" fill="#DCA660" />
            <path d="M30 31.5c.8-1 2-1.3 3.1-.9M35 35c.5-.6 1.3-.8 2-.5" fill="none" stroke="#9A4E24" stroke-width="1.6" stroke-linecap="round" />
          </g>
          <g fill="none" stroke="#2b2118" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="32" cy="32" r="22.5" />
            <path d="M36.4 18.5A14.2 14.2 0 1 1 30.2 17.9" />
            <path d="M27.2 34.6c-.8-4.2 2-7.6 5.6-7.6c3.4 0 5.8 2.6 5.6 6.2c-.2 3.4-2.8 5.6-6 5.4c-2.4-.1-4-1.4-4.8-3.2" />
            <path d="M57.5 12v14M54.8 12v8.2c0 2 1.2 3 2.7 3s2.7-1 2.7-3V12M57.5 23.4V52" />
          </g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
